name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: 安裝相依套件
        run: npm ci
      - name: 內容檢查
        run: node scripts/check.mjs
      - name: 建置網頁手冊
        run: node scripts/build.mjs
      - name: 單檔檢查
        run: |
          size=$(stat -c %s web/index.html)
          echo "web/index.html: $size bytes"
          test "$size" -lt 20000000
          ! grep -Eo '(src|href)="(\./|\.\./)?(visual|motion|content)/' web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: handbook
          path: web/index.html
